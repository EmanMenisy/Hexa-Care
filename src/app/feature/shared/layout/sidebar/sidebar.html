<aside
  class="sidebar"
  [class.open]="isOpen()">

  <div class="sidebar-header">
    <div class="brand">
      <img class="brand-logo" src="/images/logo.png" alt="" (click)="toggle.emit()">

      @if (isOpen()) {
        <div class="brand-text">
          <strong>Hexa-Care</strong>
          <small>Contracts</small>
        </div>
      }
    </div>
  </div>


  <nav class="sidebar-nav">
    <ul>
      @for (item of items; track item.id) {

        @if (item.description && isOpen()) {
          <li class="section-label">{{ item.description }}</li>
        }

        <li
          class="menu-item"
          [class.active]="isModuleActive(item)">

          <app-sidebar-item
            [item]="item"
            [isOpen]="isOpen()"
            [isSinglePage]="isSinglePage(item)"
            [isExpanded]="isExpanded(item)"
            [isActive]="isModuleActive(item)"
            (itemClick)="onItemClick(item)" />
        </li>

        @if (!isSinglePage(item) && isExpanded(item) && isOpen()) {
          <ul class="submenu">
            @for (child of item.children; track child.id) {
              <li
                class="submenu-item"
                [class.active]="isItemActive(child)">

                <app-sidebar-item
                  [item]="child"
                  [isOpen]="isOpen()"
                  [isChild]="true"
                  [isSinglePage]="true"
                  [isActive]="isItemActive(child)" />
              </li>
            }
          </ul>
        }
      }
    </ul>
  </nav>

</aside>
