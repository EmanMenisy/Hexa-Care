<header class="header">

  <div class="search-box">
    <i class="icon-search">🔍</i>
    <input
      type="text"
      class="search-input"
 />
  </div>

  <div class="header-actions">
    <button
      type="button"
      class="btn-create">

      <i>+</i>
      <span>Create</span>
    </button>

    <button
      type="button"
      class="icon-btn lang-btn"
      aria-label="Toggle language">

      <span>Aع</span>
    </button>

    <button
      type="button"
      class="icon-btn"

      aria-label="Toggle theme">

      <!-- <span>{{ isDarkMode() ? '☀️' : '🌙' }}</span> -->
    </button>

    <button
      type="button"
      class="icon-btn"
      aria-label="Open chat">

      <span>💬</span>
    </button>

    <button
      type="button"
      class="icon-btn notif-btn"
      aria-label="Open notifications">

      <span>🔔</span>
    </button>
  </div>

</header>
