<span
  class="unicode-plainText text-blue {{ column.cssClass }} {{
    column.field + '-' + value
  }} "
  [ngClass]="{ clickable: column.isClickable }"
>
  {{ "customComponents.table.enum." + value | translate }}
  <ng-container *ngIf="column.extraColumnData">
    <span class="font-regular-medium text-blue unicode-plainText">
      {{ column.extraColumnData }}
    </span>
  </ng-container>
</span>
