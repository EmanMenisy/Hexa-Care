<div class="creation-page">
  <div class="creation-page__stepper">
  <hexa-creation-stepper
  [steps]="steps()"
  [(step)]="step"
  [maxStep]="maxStep()"
/>  
</div>
  <div class="creation-page__content">
    @switch (step()) {
      @case (1) {
        <hexa-personal-info [personalForm]="form.controls.personal"  [staffMode]="staffMode()"></hexa-personal-info>
      }
      @case (2) {
        <hexa-professional-information [professionalForm]="form.controls.professional"  [staffMode]="staffMode()"></hexa-professional-information>
      }
      @case (3) {
        <hexa-assignation-information [assignationForm]="form.controls.assignment"></hexa-assignation-information>
      }
      @case (4) {
        <!-- <hexa-documents-info /> -->
      }
    }
  </div>

 <div
  class="creation-page__footer
         d-flex
         flex-column flex-md-row
         align-items-start align-items-md-center
         justify-content-between
         gap-3"
>
  <div class="creation-page__footer-note">
    <em class="pi pi-info-circle"></em>

    <span>
      Fields marked * are required; the doctor code is generated automatically.
    </span>
  </div>

  <div class="creation-page__footer-actions d-flex align-items-center gap-2">
    <hexa-button
      label="Cancel"
      severity="secondary"
      (clicked)="onCancel()"
    ></hexa-button>

    @if (!isLastStep) {
      <hexa-button
        label="Next"
        severity="primary"
        (clicked)="onNext()"
        [disabled]="!canGoNext()" 
      ></hexa-button>
    } @else {
      <button
        type="button"
        class="btn btn-primary"
        (click)="onSave()"
      >
        <em class="pi pi-save"></em>
        Save doctor
      </button>
    }
  </div>
</div>
</div>
