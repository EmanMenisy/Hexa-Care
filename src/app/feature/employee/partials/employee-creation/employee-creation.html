<div class="creation-page">
  <div class="creation-page__stepper">
  <hexa-creation-stepper
  [steps]="steps()"
  [(step)]="step"
  [maxStep]="maxStep()"
/>  
</div>
 <div class="creation-page__content">
  <div [class.d-none]="step() !== 1">
    <hexa-personal-info [existingPhotoUrl]="photoUrl()"
     [personalForm]="form.controls.personal" [staffMode]="staffMode()"></hexa-personal-info>
  </div>
  <div [class.d-none]="step() !== 2">
    <hexa-professional-information [professionalForm]="form.controls.professional" [staffMode]="staffMode()"  
   ></hexa-professional-information>
  </div>
  <div [class.d-none]="step() !== 3">
    <hexa-assignation-information #assignationInfo   [initialAssignation]="staffAssignationData()"
     [assignationForm]="form.controls.assignment" [createRoleFn]="createRole.bind(this)"></hexa-assignation-information>
  </div>
  <div [class.d-none]="step() !== 4">
    <hexa-attachments  [existingAttachments]="existingAttachments()"></hexa-attachments>
  </div>
</div>

 <div
  class="creation-page__footer
         d-flex
         flex-column flex-md-row
         align-items-start align-items-md-center
         justify-content-between
         gap-3"
>
  <div class="creation-page__footer-note">
    <em class="pi pi-info-circle"></em>

    <span>
      Fields marked <span class="text-danger">*</span> are required; the doctor code is generated automatically.
    </span>
  </div>

  <div class="creation-page__footer-actions d-flex align-items-center gap-2">
    <hexa-button
      label="{{ 'buttons.cancel' | translate }}"
      severity="secondary"
      (clicked)="onCancel()"
    ></hexa-button>
    @if (isSaveStep) {
      <hexa-button
        type="button"
        (click)="onSave()"
        label="{{ 'buttons.save' | translate }}"
        [disabled]="form.controls.assignment.invalid"
      >
      </hexa-button>
    }
    @else if (!isLastStep) {
      <hexa-button
        label="{{ 'buttons.next' | translate }}"
        severity="primary"
        (clicked)="onNext()"
        [disabled]="!canGoNext()" 
      ></hexa-button>
    } @else  {
          <!-- step 4: Documents -->
     <hexa-button
      label="Upload & Finish"
      severity="primary"
      (clicked)="onUploadDocuments()">
    </hexa-button>
    }
  </div>
</div>
</div>
