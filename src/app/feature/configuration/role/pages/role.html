<app-manual-role (closeDialog)="closeManualSidebar()" [visible]="isManualSidebarVisible()" [model]="selectedRole"></app-manual-role>

<div class="p-2">
    <app-table
      [data]="roleList()"
      [columns]="tableColumns"
      [actions]="tableActions"
      [loading]="pageStatus === PageStatus.Loading"
      [canSelect]="false"
      [selectedRecords]="selectedRoles()"
      (selectedRecordsChanged)="onSelectedRolesChanged($event)"
      [sortField]="activeSortField"
      [sortOrder]="activeSortAscending"
      (sortChanged)="onSortChanged($event)"
      [totalRecordsLength]="totalRecordsLength"
      [pageSize]="roleRequest.pageSize"
      [pageNumber]="roleRequest.pageNumber"
      (pageNumberChange)="getAllRoles($event)"
      (actionClicked)="onTableAction($event)"
    >
      <ng-template hexaColumnTemplate="isActive" let-value let-row="row">
        <span class="role-status" [class.role-status--active]="value" [class.role-status--inactive]="!value">
          {{ value ? 'Active' : 'Inactive' }}
        </span>
      </ng-template>
    </app-table>
</div>
